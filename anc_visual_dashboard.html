<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Mic Inversion Scope</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315;
      --surface: #17191d;
      --field: #121417;
      --line: #303640;
      --text: #edf1f5;
      --muted: #9ea8b4;
      --blue: #5aa7e8;
      --orange: #e98b3a;
      --yellow: #d6b35a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: #15171a;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    main {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: calc(100vh - 62px);
    }

    aside {
      border-right: 1px solid var(--line);
      background: #141619;
      padding: 14px;
    }

    .content {
      padding: 14px;
      overflow: auto;
    }

    .control-group {
      padding: 12px 0;
      border-bottom: 1px solid #252a31;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #20252d;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover {
      border-color: #55606f;
    }

    input[type="range"] {
      width: 100%;
      height: 22px;
      accent-color: var(--blue);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .value {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .metric-strip {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      padding: 10px 12px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .metric .number {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .panel {
      min-height: 220px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #1a1d22;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
    }

    .panel-note {
      color: var(--muted);
      font-size: 11px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 205px;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Live Mic Inversion Scope</h1>
    </div>
  </header>

  <main>
    <aside>
      <div class="metric-strip">
        <div class="metric">
          <div class="label">Input level</div>
          <div id="inputMetric" class="number">--</div>
        </div>
      </div>

      <div class="control-group">
        <button id="micButton">Start Microphone</button>
        <div class="row" style="margin-top: 8px;"><span>Live input</span><span id="micStatus" class="value">Off</span></div>
      </div>

      <div class="control-group">
        <label for="gainSlider">Inverse gain</label>
        <input id="gainSlider" type="range" min="0" max="1" step="0.01" value="0.35">
        <div class="row"><span>Gain</span><span id="gainValue" class="value">0.35</span></div>
      </div>
    </aside>

    <section class="content">
      <div class="grid">
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Live microphone waveform</div>
            <div class="panel-note">browser microphone</div>
          </div>
          <canvas id="inputCanvas"></canvas>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Electrical inverse waveform</div>
            <div class="panel-note">negative copy, not played</div>
          </div>
          <canvas id="antiCanvas"></canvas>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Phase overlay</div>
            <div class="panel-note">blue input vs orange inverse</div>
          </div>
          <canvas id="overlayCanvas"></canvas>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Live spectrum</div>
            <div class="panel-note">mic vs inverse magnitude</div>
          </div>
          <canvas id="spectrumCanvas"></canvas>
        </div>

        <div class="panel wide">
          <div class="panel-header">
            <div class="panel-title">Live microphone level history</div>
            <div class="panel-note">input dB over time</div>
          </div>
          <canvas id="historyCanvas"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script>
    const plotSize = 2048;
    const historySize = 260;

    const live = {
      context: null,
      analyser: null,
      source: null,
      stream: null,
      buffer: null,
      ready: false
    };

    const state = {
      history: new Float32Array(historySize),
      historyWrite: 0
    };

    const controls = {
      gain: document.getElementById("gainSlider")
    };

    const labels = {
      gain: document.getElementById("gainValue"),
      input: document.getElementById("inputMetric"),
      micStatus: document.getElementById("micStatus")
    };

    const canvases = {
      input: document.getElementById("inputCanvas"),
      anti: document.getElementById("antiCanvas"),
      overlay: document.getElementById("overlayCanvas"),
      spectrum: document.getElementById("spectrumCanvas"),
      history: document.getElementById("historyCanvas")
    };

    document.getElementById("micButton").addEventListener("click", startLiveMic);
    controls.gain.addEventListener("input", updateLabels);
    updateLabels();

    function updateLabels() {
      labels.gain.textContent = Number(controls.gain.value).toFixed(2);
    }

    async function startLiveMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });
        stopLiveMic();
        live.context = new (window.AudioContext || window.webkitAudioContext)();
        live.stream = stream;
        live.source = live.context.createMediaStreamSource(stream);
        live.analyser = live.context.createAnalyser();
        live.analyser.fftSize = plotSize;
        live.analyser.smoothingTimeConstant = 0;
        live.buffer = new Float32Array(live.analyser.fftSize);
        live.source.connect(live.analyser);
        live.ready = true;
        labels.micStatus.textContent = "On";
      } catch (error) {
        labels.micStatus.textContent = "Blocked";
        labels.input.textContent = "mic blocked";
      }
    }

    function stopLiveMic() {
      if (live.source) {
        try {
          live.source.disconnect();
        } catch (_) {
        }
      }
      if (live.stream) {
        live.stream.getTracks().forEach(track => track.stop());
      }
      if (live.context && live.context.state !== "closed") {
        live.context.close();
      }
      live.context = null;
      live.analyser = null;
      live.source = null;
      live.stream = null;
      live.buffer = null;
      live.ready = false;
    }

    function db(value) {
      return 20 * Math.log10(Math.max(value, 1e-9));
    }

    function drawWave(canvas, data, color, scale = 1) {
      resizeCanvas(canvas);
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      drawGrid(ctx, w, h);
      drawLine(ctx, data, color, w, h, scale);
      ctx.strokeStyle = "#606775";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();
    }

    function drawOverlay(canvas, input, anti) {
      resizeCanvas(canvas);
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      drawGrid(ctx, w, h);
      drawLine(ctx, input, "#5aa7e8", w, h, 1.35);
      drawLine(ctx, anti, "#e98b3a", w, h, 1.35);
      const phaseScore = inverseCorrelation(input, anti);
      ctx.fillStyle = "#edf1f5";
      ctx.font = `${Math.max(13, Math.round(h * 0.06))}px system-ui, sans-serif`;
      ctx.fillText(`inverse correlation: ${phaseScore.toFixed(3)}`, 16, 28);
      ctx.fillStyle = "#9ea8b4";
      ctx.fillText("1.000 means the orange trace is an exact negative copy", 16, 52);
    }

    function drawLine(ctx, data, color, w, h, scale) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < data.length; i++) {
        const x = i / (data.length - 1) * w;
        const y = h / 2 - data[i] * scale * h * 0.38;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function inverseCorrelation(input, anti) {
      let xy = 0;
      let xx = 0;
      let yy = 0;
      const n = Math.min(input.length, anti.length);
      for (let i = 0; i < n; i++) {
        xy += input[i] * anti[i];
        xx += input[i] * input[i];
        yy += anti[i] * anti[i];
      }
      return -xy / Math.sqrt(Math.max(xx * yy, 1e-12));
    }

    function drawSpectrum(canvas, input, anti) {
      resizeCanvas(canvas);
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      drawGrid(ctx, w, h);
      const bins = 80;
      const inSpec = simpleSpectrum(input, bins);
      const antiSpec = simpleSpectrum(anti, bins);
      for (let i = 0; i < bins; i++) {
        const x = i / bins * w;
        const barW = Math.max(2, w / bins - 3);
        const inH = Math.min(h - 20, Math.max(2, inSpec[i] * h));
        const antiH = Math.min(h - 20, Math.max(2, antiSpec[i] * h));
        ctx.fillStyle = "rgba(90, 167, 232, 0.55)";
        ctx.fillRect(x, h - inH, barW, inH);
        ctx.fillStyle = "rgba(233, 139, 58, 0.70)";
        ctx.fillRect(x + barW * 0.42, h - antiH, barW * 0.55, antiH);
      }
    }

    function simpleSpectrum(data, bins) {
      const result = new Float32Array(bins);
      const n = Math.min(512, data.length);
      for (let k = 0; k < bins; k++) {
        let re = 0;
        let im = 0;
        const freqBin = k + 1;
        for (let i = 0; i < n; i++) {
          const window = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1));
          const angle = 2 * Math.PI * freqBin * i / n;
          const sample = data[data.length - n + i] * window;
          re += sample * Math.cos(angle);
          im -= sample * Math.sin(angle);
        }
        result[k] = Math.min(1, Math.sqrt(re * re + im * im) / 45);
      }
      return result;
    }

    function drawHistory(canvas) {
      resizeCanvas(canvas);
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      drawGrid(ctx, w, h);
      ctx.strokeStyle = "#5aa7e8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < historySize; i++) {
        const value = state.history[(state.historyWrite + i) % historySize];
        const x = i / (historySize - 1) * w;
        const y = h - Math.max(0, Math.min(1, (value + 70) / 70)) * h;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function drawMessage(canvas, title, body) {
      resizeCanvas(canvas);
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      drawGrid(ctx, w, h);
      ctx.fillStyle = "#edf1f5";
      ctx.font = `700 ${Math.max(16, Math.round(h * 0.08))}px system-ui, sans-serif`;
      ctx.fillText(title, 20, h / 2 - 12);
      ctx.fillStyle = "#9ea8b4";
      ctx.font = `${Math.max(13, Math.round(h * 0.055))}px system-ui, sans-serif`;
      ctx.fillText(body, 20, h / 2 + 18);
    }

    function drawGrid(ctx, w, h) {
      ctx.fillStyle = "#0d0f12";
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "#252a32";
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 48) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y < h; y += 36) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
    }

    function resizeCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.floor(rect.width * ratio));
      const height = Math.max(1, Math.floor(rect.height * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    function drawWaiting() {
      drawMessage(canvases.input, "Microphone not started", "Click Start Microphone and allow browser access.");
      drawMessage(canvases.anti, "Waiting for live input", "The inverse trace will appear here.");
      drawMessage(canvases.overlay, "Phase overlay", "Blue input and orange inverse will be drawn together.");
      drawMessage(canvases.spectrum, "Live spectrum", "Microphone spectrum appears after permission is granted.");
      drawMessage(canvases.history, "Live level history", "Input dB history appears after permission is granted.");
    }

    function render() {
      if (!live.ready) {
        drawWaiting();
        requestAnimationFrame(render);
        return;
      }

      live.analyser.getFloatTimeDomainData(live.buffer);
      const input = live.buffer;
      const anti = new Float32Array(input.length);
      const gain = Number(controls.gain.value);
      let sumInput = 0;
      for (let i = 0; i < input.length; i++) {
        anti[i] = -gain * input[i];
        sumInput += input[i] * input[i];
      }

      const inputRms = Math.sqrt(sumInput / input.length);
      state.history[state.historyWrite] = db(inputRms);
      state.historyWrite = (state.historyWrite + 1) % historySize;
      labels.input.textContent = `${db(inputRms).toFixed(1)} dB`;

      drawWave(canvases.input, input, "#5aa7e8", 1.6);
      drawWave(canvases.anti, anti, "#e98b3a", 1.8);
      drawOverlay(canvases.overlay, input, anti);
      drawSpectrum(canvases.spectrum, input, anti);
      drawHistory(canvases.history);
      requestAnimationFrame(render);
    }

    drawWaiting();
    render();
  </script>
</body>
</html>
